name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build fat jar
        run: mvn -B -ntp package -DskipTests

      - name: Package with jpackage
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          jpackage --type app-image `
            --name "B1248-Name-Badge-Programmer" `
            --app-version $version `
            --input target `
            --main-jar b1248-badge-programmer.jar `
            --main-class com.franklouw.b1248.ui.Launcher `
            --add-modules java.se,jdk.unsupported `
            --dest dist

      - name: Zip app image
        shell: pwsh
        run: Compress-Archive -Path "dist\B1248-Name-Badge-Programmer\*" -DestinationPath "dist\B1248-Name-Badge-Programmer-win64.zip"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/B1248-Name-Badge-Programmer-win64.zip
          generate_release_notes: true
